<!doctype html>
<html lang="sl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Strani ni mogoče najti – noDesk</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0a0a0a">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  :root { --bg: #0a0a0a; --text: #f0f0f0; --text-2: #c1c1c1; --accent: #ffa65e; --on-accent: #331700; color-scheme: dark; }
  @media (prefers-color-scheme: light) { :root { --bg: #f4f4f4; --text: #1c1c1c; --text-2: #4c4c4c; --accent: #ed8725; --on-accent: #331700; color-scheme: light; } }
  * { box-sizing: border-box; margin: 0; }
  body { min-height: 100svh; display: grid; place-content: center; justify-items: center; gap: 14px; text-align: center; padding: 24px; background: var(--bg); color: var(--text);
         font: 16px/1.5 "Manrope", "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; }
  h1 { font: 800 clamp(3.5rem, 14vw, 7rem)/1 "Manrope", "Segoe UI", system-ui, sans-serif; letter-spacing: -.05em; color: var(--accent); }
  p { color: var(--text-2); max-width: 36ch; }
  a { display: inline-flex; align-items: center; min-height: 44px; padding: 0 20px; margin-top: 8px; border-radius: 14px; background: var(--accent); color: var(--on-accent); font-weight: 600; text-decoration: none; }
  a:focus-visible { outline: 2px solid var(--text); outline-offset: 3px; }
</style>
</head>
<body>
  <h1>404</h1>
  <p id="message">Te strani ni na tem namizju. Nič ni bilo premaknjeno ali izbrisano.</p>
  <label for="language">Jezik / Language</label>
  <select id="language" style="font:inherit;padding:10px;border-radius:10px"><option value="sl" lang="sl">Slovenščina</option><option value="en" lang="en">English</option></select>
  <!-- Absolute "/" would break under a project subpath, so go up from wherever this page is served. -->
  <a id="home" href="./">Nazaj na noDesk</a>
  <script>
    // On a project site (user.github.io/repo/missing) "/" is the wrong root: use the first path segment only when it is the repo.
    (function () {
      var language = document.getElementById('language');
      try { language.value = localStorage.getItem('nodesk.site.language') === 'en' ? 'en' : 'sl'; } catch (e) {}
      function apply() {
        var en = language.value === 'en';
        document.documentElement.lang = en ? 'en' : 'sl';
        document.title = en ? 'Not found – noDesk' : 'Strani ni mogoče najti – noDesk';
        document.getElementById('message').textContent = en ? 'That page is not on this desktop. Nothing was moved or deleted.' : 'Te strani ni na tem namizju. Nič ni bilo premaknjeno ali izbrisano.';
        document.getElementById('home').textContent = en ? 'Back to noDesk' : 'Nazaj na noDesk';
      }
      language.addEventListener('change', function () { try { localStorage.setItem('nodesk.site.language', language.value); } catch (e) {} apply(); });
      apply();
      var host = location.hostname, seg = location.pathname.split('/')[1];
      if (/\.github\.io$/.test(host) && seg) document.getElementById('home').href = '/' + seg + '/';
      else document.getElementById('home').href = '/';
      var i = document.querySelector('link[rel=icon]'); if (i && /\.github\.io$/.test(host) && seg) i.href = '/' + seg + '/favicon.svg';
    })();
  </script>
</body>
</html>
